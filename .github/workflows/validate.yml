name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a branch on purpose: the Home Assistant docs specify
      # home-assistant/actions/hassfest@master, and its only tag is from 2020.
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Likewise: the HACS docs specify hacs/action@main.
      - uses: hacs/action@main
        with:
          category: integration
